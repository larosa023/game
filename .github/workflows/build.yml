name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Stamp version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="1.0.${{ github.run_number }}"; fi
          echo "$v" > assets/version.txt
          echo "Building version $v"

      - name: Build Oasis.exe
        shell: bash
        run: ./gradlew :lwjgl3:jpackageImage --no-daemon --stacktrace

      - name: Test the packaged Java runtime has everything the game needs
        shell: bash
        run: lwjgl3/build/jpackage/Oasis/runtime/bin/java -cp lwjgl3/build/jpackage/Oasis/app/Oasis-1.0.0.jar me.vrekt.oasis.update.RuntimeSelfTest lwjgl3/build/jpackage/Oasis/app/Oasis-1.0.0.jar

      - name: Test the updater's install step
        shell: bash
        run: java -cp lwjgl3/build/lib/Oasis-1.0.0.jar me.vrekt.oasis.update.InstallerSelfTest

      - name: Zip game
        shell: pwsh
        run: |
          Get-ChildItem -Recurse lwjgl3/build/jpackage | Select-Object -First 20 FullName
          Compress-Archive -Path lwjgl3/build/jpackage/Oasis -DestinationPath Oasis-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Oasis-windows
          path: Oasis-windows.zip

      - name: Publish release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Oasis v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Oasis-windows.zip
          body_path: RELEASE_NOTES.md
