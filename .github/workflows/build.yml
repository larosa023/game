name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Oasis.exe
        shell: bash
        run: ./gradlew :lwjgl3:jpackageImage --no-daemon --stacktrace

      - name: Zip game
        shell: pwsh
        run: |
          Get-ChildItem -Recurse lwjgl3/build/jpackage | Select-Object -First 20 FullName
          Compress-Archive -Path lwjgl3/build/jpackage/Oasis -DestinationPath Oasis-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Oasis-windows
          path: Oasis-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Oasis-windows.zip
          body: |
            Windows build of Oasis. Download **Oasis-windows.zip**, unzip it anywhere, and run `Oasis\Oasis.exe`.
            No Java install needed — it's bundled.
